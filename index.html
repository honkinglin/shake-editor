<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="shake-editor playground" />
    <title>shake-editor</title>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">POWER MODE, REBUILT</p>
      <h1>shake-editor</h1>

      <section id="editor" class="editor-shell">
        <div class="window-bar"><span></span><span></span><span></span><code>idea.ts</code></div>
        <textarea autofocus spellcheck="false">const nextIdea = () => {
  return 'type something brilliant';
};</textarea>
      </section>
      <p class="hint">Try typing in the editor</p>
    </main>
    <script type="module" src="/demo/main.ts"></script>
  </body>
